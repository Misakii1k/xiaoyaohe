name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build Web assets
        run: npm run build:web
        env:
          VITE_BASE_PATH: './'

      - name: Sync Capacitor Android
        run: npx cap sync android

      # 缺密钥时必须直接失败：临时生成的签名密钥与用户已安装应用的签名不一致，
      # 产出的 APK 既装不上（INSTALL_FAILED_UPDATE_INCOMPATIBLE）也永远升不了级。
      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少签名密钥 secret:$missing"
            echo "不会用临时生成的密钥签名（用户装不上也升不了级）。"
            echo "请补齐上述 secrets，或改用本地 npm run release -- --android-variant release。"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat <<EOF > android/app/keystore.properties
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease testReleaseUnitTest

      - name: Package and Hash Release Artifacts
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          TARGET_APK="xiaoyaohe-${APP_VERSION}-android-release.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "./${TARGET_APK}"
          sha256sum "${TARGET_APK}" > SHA256SUMS.txt
          echo "APK generated: ${TARGET_APK}"
          cat SHA256SUMS.txt

      - name: Upload APK Artifact to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            xiaoyaohe-*-android-release.apk
            SHA256SUMS.txt
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            xiaoyaohe-*-android-release.apk
            SHA256SUMS.txt
          generate_release_notes: true

      # 发版后立刻验证线上链路（version.json、代理、非法 tag、APK 直链）。
      # 缺 GITHUB_TOKEN 时这里会红，正是它该红的时候。
      - name: Smoke-check live release endpoints
        run: node scripts/check-release-endpoints.mjs
        env:
          MEDBOX_CLOUD_ORIGIN: ${{ vars.MEDBOX_CLOUD_ORIGIN }}
