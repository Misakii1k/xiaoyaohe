<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Main Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="75%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glass Box Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.65" />
    </linearGradient>

    <!-- Pill Top Half Gradient (Coral Pink) -->
    <linearGradient id="pillTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF758C" />
      <stop offset="100%" stop-color="#FF7EB3" />
    </linearGradient>

    <!-- Pill Bottom Half Gradient (Mint Cyan) -->
    <linearGradient id="pillBottomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D depth -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.3" />
    </filter>
    
    <filter id="pillShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- iOS Squircle / Rounded Background -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)" />

  <!-- Background Ambient Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />

  <!-- Main Container: Glass MedBox Base (Rounded 3D Organizer Shell) -->
  <g filter="url(#dropShadow)">
    <!-- MedBox Grid Container Shell -->
    <rect x="106" y="106" width="300" height="300" rx="56" ry="56" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.9" />
    
    <!-- Inner Grid Compartments (3x3 grid lines) -->
    <rect x="130" y="130" width="76" height="76" rx="20" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="218" y="130" width="76" height="76" rx="20" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="306" y="130" width="76" height="76" rx="20" fill="#FFFFFF" fill-opacity="0.4" />

    <rect x="130" y="218" width="76" height="76" rx="20" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="218" y="218" width="76" height="76" rx="20" fill="#FFFFFF" fill-opacity="0.6" />
    <rect x="306" y="218" width="76" height="76" rx="20" fill="#FFFFFF" fill-opacity="0.4" />

    <rect x="130" y="306" width="76" height="76" rx="20" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="218" y="306" width="76" height="76" rx="20" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="306" y="306" width="76" height="76" rx="20" fill="#FFFFFF" fill-opacity="0.4" />
  </g>

  <!-- Hero Pill Capsule floating diagonally in front -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)" filter="url(#pillShadow)">
    <!-- Capsule Left Half -->
    <path d="M 176,216 A 40,40 0 0,1 216,176 L 256,176 L 256,336 L 216,336 A 40,40 0 0,1 176,296 Z" fill="url(#pillTopGrad)" />
    
    <!-- Capsule Right Half -->
    <path d="M 256,176 L 296,176 A 40,40 0 0,1 336,216 L 336,296 A 40,40 0 0,1 296,336 L 256,336 Z" fill="url(#pillBottomGrad)" />

    <!-- Capsule Center Divider Ring -->
    <line x1="256" y1="172" x2="256" y2="340" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

    <!-- Capsule Glossy Highlight -->
    <path d="M 200,192 Q 256,188 312,192" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-opacity="0.65" fill="none" />
  </g>

  <!-- Notification Badge / Heart Checkmark Ring on top right -->
  <g filter="url(#dropShadow)" transform="translate(340, 120)">
    <circle cx="36" cy="36" r="38" fill="#10B981" stroke="#FFFFFF" stroke-width="5" />
    <!-- Checkmark icon -->
    <path d="M 22 36 L 32 46 L 50 26" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
