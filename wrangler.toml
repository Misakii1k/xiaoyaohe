name = "medbox"
main = "worker/index.ts"
compatibility_date = "2026-07-13"

[[kv_namespaces]]
binding = "MEDBOX"
id = "9ed3684b797147e0a5a26bbf7cd90d34"

[[durable_objects.bindings]]
name = "SYNC_V2_HOUSEHOLDS"
class_name = "SyncV2Household"

[[durable_objects.bindings]]
name = "SYNC_V2_RATE_LIMITER"
class_name = "SyncV2RateLimiter"

[[migrations]]
tag = "sync-v2-initial"
new_sqlite_classes = ["SyncV2Household", "SyncV2RateLimiter"]

[vars]
# Both values must be deliberately configured before the v2 API serves traffic.
SYNC_V2_ENABLED = "false"
SYNC_V2_ALLOWED_ORIGINS = ""
SYNC_V1_READONLY_ENABLED = "false"

[observability]
enabled = true
