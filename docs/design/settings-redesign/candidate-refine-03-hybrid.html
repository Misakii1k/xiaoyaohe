<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精进 3 - 双剑合璧融合版</title>
<style>
:root {
  /* 严格遵循小药盒官方 Design Tokens */
  --color-bg: #f6f8f7;
  --color-surface: #ffffff;
  --color-surface-muted: #edf1ef;
  --color-text: #202e2b;
  --color-text-muted: #64706b;
  --color-border: #e1e8e4;
  --color-primary: #236a55;
  --color-primary-soft: #e3ede6;
  --color-primary-pressed: #175940;
  --font-sans: 'MiSans', 'HarmonyOS Sans SC', 'PingFang SC', -apple-system, sans-serif;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 20px;
  --radius-full: 999px;
  --shadow-sm: 0 1px 3px rgba(32, 46, 43, 0.04), 0 4px 12px rgba(32, 46, 43, 0.03);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.45;
  padding: 16px 16px 84px;
  max-width: 440px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
}

/* 顶部名片：结合 03 排印大气与 02 的头像亲和感 */
.hybrid-header {
  padding: 10px 4px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.avatar-ring {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--color-primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.header-titles h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--color-text);
}
.header-titles p {
  font-size: 12px;
  color: var(--color-text-muted);
}
.status-pill {
  font-size: 11px;
  font-weight: 600;
  color: var(--color-primary);
  background: var(--color-primary-soft);
  padding: 4px 10px;
  border-radius: var(--radius-full);
}

/* 融合 03：纯排印大数字看板卡片 */
.stats-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 16px 14px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-around;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.stat-entry strong {
  display: block;
  font-size: 20px;
  font-weight: 800;
  color: var(--color-primary);
}
.stat-entry span {
  font-size: 11px;
  color: var(--color-text-muted);
  margin-top: 2px;
  display: block;
}

/* 融合 02：精炼 2 枚高频快捷磁贴 */
.quick-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.quick-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform 0.1s;
}
.quick-card:active {
  transform: scale(0.985);
}
.quick-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--color-primary-soft);
  color: var(--color-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.quick-meta h4 {
  font-size: 13px;
  font-weight: 700;
  color: var(--color-text);
}
.quick-meta p {
  font-size: 11px;
  color: var(--color-text-muted);
  margin-top: 1px;
}

/* 融合 03：紧凑分组设置列表 */
.group-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-muted);
  margin: 14px 4px 8px;
  letter-spacing: 0.3px;
}
.settings-box {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 18px;
  position: relative;
  cursor: pointer;
  background: #ffffff;
  transition: background 0.15s;
}
.setting-row:active {
  background: #f7faf8;
}
.setting-row::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 48px;
  right: 18px;
  height: 1px;
  background: var(--color-border);
}
.setting-row:last-child::after {
  display: none;
}
.setting-lead {
  display: flex;
  align-items: center;
  gap: 12px;
}
.icon-mono {
  width: 19px;
  height: 19px;
  color: var(--color-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.setting-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--color-text);
}
.setting-trail {
  display: flex;
  align-items: center;
  gap: 6px;
}
.setting-val {
  font-size: 13px;
  color: var(--color-text-muted);
}
.setting-val.brand {
  color: var(--color-primary);
  font-weight: 600;
}
.chevron {
  color: #b5c2bc;
  font-size: 15px;
}

.footer-stamp {
  margin-top: 28px;
  text-align: center;
  font-size: 11px;
  color: var(--color-text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
</style>
</head>
<body>
  <!-- 顶部名片 -->
  <div class="hybrid-header">
    <div class="header-left">
      <div class="avatar-ring">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="header-titles">
        <h1>小药盒主账号</h1>
        <p>第 42 天 · 128 次服药打卡</p>
      </div>
    </div>
    <span class="status-pill">守护中</span>
  </div>

  <!-- 3 列高对比墨绿数字 -->
  <div class="stats-card">
    <div class="stat-entry">
      <strong>12</strong>
      <span>在库药品</span>
    </div>
    <div class="stat-entry">
      <strong>4</strong>
      <span>用药计划</span>
    </div>
    <div class="stat-entry">
      <strong>100%</strong>
      <span>服药达成</span>
    </div>
  </div>

  <!-- 2 枚高频快捷磁贴 -->
  <div class="quick-row">
    <div class="quick-card">
      <div class="quick-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </div>
      <div class="quick-meta">
        <h4>服药闹钟</h4>
        <p>响铃+振动</p>
      </div>
    </div>

    <div class="quick-card">
      <div class="quick-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      </div>
      <div class="quick-meta">
        <h4>后台保活</h4>
        <p>白名单生效</p>
      </div>
    </div>
  </div>

  <!-- 偏好与系统设置 -->
  <div class="group-title">系统偏好与支持</div>
  <div class="settings-box">
    <div class="setting-row">
      <div class="setting-lead">
        <span class="icon-mono">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </span>
        <span class="setting-name">时段划分</span>
      </div>
      <div class="setting-trail">
        <span class="setting-val">4 个时段</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-lead">
        <span class="icon-mono">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle></svg>
        </span>
        <span class="setting-name">面对面同步</span>
      </div>
      <div class="setting-trail">
        <span class="setting-val brand">就绪</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-lead">
        <span class="icon-mono">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </span>
        <span class="setting-name">数据备份</span>
      </div>
      <div class="setting-trail">
        <span class="setting-val">自动备份</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-lead">
        <span class="icon-mono">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line></svg>
        </span>
        <span class="setting-name">外观显示</span>
      </div>
      <div class="setting-trail">
        <span class="setting-val">系统默认</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-lead">
        <span class="icon-mono">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>
        </span>
        <span class="setting-name">AI 助手</span>
      </div>
      <div class="setting-trail">
        <span class="setting-val">DeepSeek</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-lead">
        <span class="icon-mono">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        </span>
        <span class="setting-name">版本更新</span>
      </div>
      <div class="setting-trail">
        <span class="setting-val">v1.0.7 最新</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-lead">
        <span class="icon-mono">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </span>
        <span class="setting-name">关于小药盒</span>
      </div>
      <div class="setting-trail">
        <span class="chevron">›</span>
      </div>
    </div>
  </div>

  <div class="footer-stamp">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2.5">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    </svg>
    <span>小药盒 · 纯本地设备离线存储</span>
  </div>
</body>
</html>
