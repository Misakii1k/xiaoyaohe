<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精进 2 - 小药盒紧凑排印版</title>
<style>
:root {
  /* 严格遵循小药盒官方 Design Tokens */
  --color-bg: #f6f8f7;
  --color-surface: #ffffff;
  --color-surface-muted: #edf1ef;
  --color-text: #202e2b;
  --color-text-muted: #64706b;
  --color-border: #e1e8e4;
  --color-primary: #236a55;
  --color-primary-soft: #e3ede6;
  --color-primary-pressed: #175940;
  --font-sans: 'MiSans', 'HarmonyOS Sans SC', 'PingFang SC', -apple-system, sans-serif;
  --radius-md: 16px;
  --radius-lg: 20px;
  --radius-full: 999px;
  --shadow-sm: 0 1px 3px rgba(32, 46, 43, 0.04), 0 4px 12px rgba(32, 46, 43, 0.03);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.45;
  padding: 16px 16px 84px;
  max-width: 440px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
}

/* 顶部瑞士排印风格大标题 + 小药盒微绿徽标 */
.typography-top {
  padding: 10px 4px 18px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.page-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.8px;
  color: var(--color-text);
}
.streak-pill {
  font-size: 11px;
  font-weight: 600;
  color: var(--color-primary);
  background: var(--color-primary-soft);
  padding: 4px 10px;
  border-radius: var(--radius-full);
}

/* 纯排印三列高对比墨绿数字（白底通透卡片） */
.stats-banner {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  display: flex;
  justify-content: space-around;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  text-align: center;
}
.stat-item strong {
  display: block;
  font-size: 22px;
  font-weight: 800;
  color: var(--color-primary);
  letter-spacing: -0.5px;
}
.stat-item span {
  font-size: 11px;
  color: var(--color-text-muted);
  margin-top: 3px;
  display: block;
  font-weight: 500;
}

/* Inset 圆角分组列表 */
.group-header {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-muted);
  margin: 18px 4px 8px;
  letter-spacing: 0.3px;
}
.inset-group {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
}
.compact-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 18px;
  position: relative;
  cursor: pointer;
  background: #ffffff;
  transition: background 0.15s;
}
.compact-row:active {
  background: #f7faf8;
}
.compact-row::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 48px;
  right: 18px;
  height: 1px;
  background: var(--color-border);
}
.compact-row:last-child::after {
  display: none;
}
.row-lead {
  display: flex;
  align-items: center;
  gap: 12px;
}
.icon-mono {
  width: 19px;
  height: 19px;
  color: var(--color-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.row-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--color-text);
}
.row-tail {
  display: flex;
  align-items: center;
  gap: 6px;
}
.status-text {
  font-size: 13px;
  color: var(--color-text-muted);
}
.status-text.brand {
  color: var(--color-primary);
  font-weight: 600;
}
.chevron {
  color: #b5c2bc;
  font-size: 15px;
}

.footer-stamp {
  margin-top: 32px;
  text-align: center;
  font-size: 12px;
  color: var(--color-text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
</style>
</head>
<body>
  <div class="typography-top">
    <h1 class="page-title">我的</h1>
    <span class="streak-pill">第 42 天 · 128 次服药</span>
  </div>

  <!-- 3 列高对比纯排印数据 -->
  <div class="stats-banner">
    <div class="stat-item">
      <strong>12</strong>
      <span>在库药品</span>
    </div>
    <div class="stat-item">
      <strong>4</strong>
      <span>用药计划</span>
    </div>
    <div class="stat-item">
      <strong>100%</strong>
      <span>服药达成</span>
    </div>
  </div>

  <!-- 分组一：用药与保活 -->
  <div class="group-header">提醒与用药</div>
  <div class="inset-group">
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </span>
        <span class="row-title">服药提醒</span>
      </div>
      <div class="row-tail">
        <span class="status-text brand">响铃 + 振动</span>
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </span>
        <span class="row-title">时段划分</span>
      </div>
      <div class="row-tail">
        <span class="status-text">4 个时段</span>
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        </span>
        <span class="row-title">后台保活</span>
      </div>
      <div class="row-tail">
        <span class="status-text brand">已守护</span>
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line></svg>
        </span>
        <span class="row-title">外观显示</span>
      </div>
      <div class="row-tail">
        <span class="status-text">跟随系统</span>
        <span class="chevron">›</span>
      </div>
    </div>
  </div>

  <!-- 分组二：数据、智能与关于 -->
  <div class="group-header">数据与关于</div>
  <div class="inset-group">
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle></svg>
        </span>
        <span class="row-title">面对面同步</span>
      </div>
      <div class="row-tail">
        <span class="status-text brand">就绪</span>
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </span>
        <span class="row-title">数据备份</span>
      </div>
      <div class="row-tail">
        <span class="status-text">自动备份</span>
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>
        </span>
        <span class="row-title">AI 助手</span>
      </div>
      <div class="row-tail">
        <span class="status-text">DeepSeek</span>
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        </span>
        <span class="row-title">版本更新</span>
      </div>
      <div class="row-tail">
        <span class="status-text">v1.0.7 最新</span>
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </span>
        <span class="row-title">关于小药盒</span>
      </div>
      <div class="row-tail">
        <span class="chevron">›</span>
      </div>
    </div>
  </div>

  <div class="footer-stamp">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2.5">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    </svg>
    <span>小药盒 · 本地纯净运行</span>
  </div>
</body>
</html>
