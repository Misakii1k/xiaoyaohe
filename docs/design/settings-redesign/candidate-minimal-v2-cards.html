<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简版本 2 - 轻量无界微卡片</title>
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --text: #14171a;
  --text-muted: #7a828a;
  --border: #e8ebed;
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "MiSans", "PingFang SC", system-ui, sans-serif;
  --radius-card: 16px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  padding: 16px 16px 80px;
  max-width: 420px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
}
.header {
  padding: 10px 4px 16px;
}
.header h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.6px;
}

/* 顶部个人卡片与 3 数字 */
.profile-card {
  background: var(--surface);
  border-radius: var(--radius-card);
  padding: 16px 18px;
  margin-bottom: 14px;
}
.profile-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.profile-user {
  display: flex;
  align-items: center;
  gap: 12px;
}
.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #14171a;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.user-name {
  font-size: 16px;
  font-weight: 600;
}
.user-days {
  font-size: 12px;
  color: var(--text-muted);
}
.user-badge {
  font-size: 11px;
  font-weight: 600;
  color: #14171a;
  background: #eaedf0;
  padding: 4px 8px;
  border-radius: 6px;
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  padding-top: 14px;
  text-align: center;
}
.stat-item strong {
  display: block;
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.stat-item span {
  font-size: 11px;
  color: var(--text-muted);
}

/* 2x2 常用微卡片 */
.micro-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.micro-card {
  background: var(--surface);
  border-radius: var(--radius-card);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 84px;
  cursor: pointer;
  transition: transform 0.1s;
}
.micro-card:active {
  transform: scale(0.98);
}
.micro-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.icon-mono {
  width: 20px;
  height: 20px;
  color: #14171a;
}
.micro-val {
  font-size: 12px;
  color: var(--text-muted);
}
.micro-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-top: 8px;
}

/* 系统列表卡片 */
.settings-box {
  background: var(--surface);
  border-radius: var(--radius-card);
  overflow: hidden;
  margin-bottom: 16px;
}
.box-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 18px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.box-row:last-child {
  border-bottom: none;
}
.box-row:active {
  background: #fafbfc;
}
.row-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.row-name {
  font-size: 14px;
  font-weight: 500;
}
.row-right {
  display: flex;
  align-items: center;
  gap: 6px;
}
.row-val {
  font-size: 13px;
  color: var(--text-muted);
}
.chevron {
  color: #b0b7be;
  font-size: 14px;
}

.footer-note {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 24px;
}
</style>
</head>
<body>
  <div class="header">
    <h1>我的</h1>
  </div>

  <!-- 顶部轻名片 + 3 数据 -->
  <div class="profile-card">
    <div class="profile-top">
      <div class="profile-user">
        <div class="avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div>
          <div class="user-name">小药盒</div>
          <div class="user-days">管理第 42 天</div>
        </div>
      </div>
      <span class="user-badge">已加密</span>
    </div>
    <div class="stats-row">
      <div class="stat-item">
        <strong>12</strong>
        <span>药品</span>
      </div>
      <div class="stat-item">
        <strong>4</strong>
        <span>计划</span>
      </div>
      <div class="stat-item">
        <strong>128</strong>
        <span>记录</span>
      </div>
    </div>
  </div>

  <!-- 4 核心微卡片 (2x2) -->
  <div class="micro-grid">
    <div class="micro-card">
      <div class="micro-top">
        <div class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </div>
        <span class="micro-val">响铃+振动</span>
      </div>
      <div class="micro-name">服药提醒</div>
    </div>

    <div class="micro-card">
      <div class="micro-top">
        <div class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        </div>
        <span class="micro-val">已保护</span>
      </div>
      <div class="micro-name">后台保活</div>
    </div>

    <div class="micro-card">
      <div class="micro-top">
        <div class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle></svg>
        </div>
        <span class="micro-val">就绪</span>
      </div>
      <div class="micro-name">面对面同步</div>
    </div>

    <div class="micro-card">
      <div class="micro-top">
        <div class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>
        </div>
        <span class="micro-val">DeepSeek</span>
      </div>
      <div class="micro-name">AI 助手</div>
    </div>
  </div>

  <!-- 系统设置整合列表 -->
  <div class="settings-box">
    <div class="box-row">
      <div class="row-left">
        <div class="icon-mono">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>
        <span class="row-name">时段划分</span>
      </div>
      <div class="row-right">
        <span class="row-val">4 个时段</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="box-row">
      <div class="row-left">
        <div class="icon-mono">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </div>
        <span class="row-name">数据备份</span>
      </div>
      <div class="row-right">
        <span class="row-val">已备份</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="box-row">
      <div class="row-left">
        <div class="icon-mono">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line></svg>
        </div>
        <span class="row-name">外观显示</span>
      </div>
      <div class="row-right">
        <span class="row-val">跟随系统</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="box-row">
      <div class="row-left">
        <div class="icon-mono">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        </div>
        <span class="row-name">存储清理</span>
      </div>
      <div class="row-right">
        <span class="row-val">2.4 MB</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="box-row">
      <div class="row-left">
        <div class="icon-mono">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        </div>
        <span class="row-name">软件更新</span>
      </div>
      <div class="row-right">
        <span class="row-val">v1.0.7 最新</span>
        <span class="chevron">›</span>
      </div>
    </div>
  </div>

  <div class="footer-note">小药盒 · 本地纯净运行</div>
</body>
</html>
