<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 C - 模块化健康工作台</title>
<style>
:root {
  --color-bg: #0f1715;
  --color-surface: #182320;
  --color-surface-elevated: #22322e;
  --color-border: #2a3d38;
  --color-text: #eef5f2;
  --color-text-muted: #8ea19a;
  --color-primary: #38bdf8;
  --color-accent-green: #34d399;
  --color-accent-amber: #fbbf24;
  --font-sans: 'MiSans', 'HarmonyOS Sans SC', 'PingFang SC', -apple-system, system-ui, sans-serif;
  --radius-widget: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.45;
  padding: 16px 16px 84px;
  max-width: 440px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
}
.dash-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0 16px;
}
.dash-title-group h1 {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: #ffffff;
}
.dash-title-group p {
  font-size: 12px;
  color: var(--color-text-muted);
  margin-top: 2px;
}
.dash-status-pill {
  background: rgba(52, 211, 153, 0.12);
  border: 1px solid rgba(52, 211, 153, 0.3);
  color: var(--color-accent-green);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pulse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--color-accent-green);
  box-shadow: 0 0 8px var(--color-accent-green);
}

/* 顶部健康看板横幅 */
.dash-banner {
  background: linear-gradient(135deg, #1b2f29 0%, #152420 100%);
  border: 1px solid #2d4740;
  border-radius: var(--radius-widget);
  padding: 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.dash-banner-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.dash-avatar-box {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: #236a55;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 18px;
  color: #fff;
  border: 1.5px solid rgba(255,255,255,0.15);
}
.dash-banner-info h3 {
  font-size: 16px;
  font-weight: 700;
  color: #ffffff;
}
.dash-banner-info p {
  font-size: 12px;
  color: var(--color-text-muted);
  margin-top: 2px;
}
.dash-badge-streak {
  background: rgba(251, 191, 36, 0.15);
  border: 1px solid rgba(251, 191, 36, 0.3);
  color: var(--color-accent-amber);
  font-size: 12px;
  font-weight: 700;
  padding: 6px 10px;
  border-radius: 10px;
  text-align: right;
}

/* Bento 2x2 控制中心磁贴 */
.bento-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
.bento-widget {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-widget);
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 128px;
  position: relative;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.2s;
}
.bento-widget:active {
  transform: scale(0.98);
}
.bento-widget.active {
  border-color: rgba(52, 211, 153, 0.4);
  background: linear-gradient(145deg, #182320 0%, #1e2e2a 100%);
}
.widget-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.widget-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.w-green { background: rgba(52, 211, 153, 0.15); color: var(--color-accent-green); }
.w-blue { background: rgba(56, 189, 248, 0.15); color: var(--color-primary); }
.w-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
.w-amber { background: rgba(251, 191, 36, 0.15); color: var(--color-accent-amber); }

.widget-switch {
  width: 38px;
  height: 22px;
  background: #2a3d38;
  border-radius: 999px;
  position: relative;
  transition: background 0.2s;
}
.widget-switch.on {
  background: var(--color-accent-green);
}
.widget-switch-thumb {
  width: 18px;
  height: 18px;
  background: #ffffff;
  border-radius: 50%;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: transform 0.2s;
}
.widget-switch.on .widget-switch-thumb {
  transform: translateX(16px);
}

.widget-bottom h4 {
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 2px;
}
.widget-bottom p {
  font-size: 11px;
  color: var(--color-text-muted);
}

/* 药品库存状态卡片 */
.dash-med-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-widget);
  padding: 16px;
  margin-bottom: 16px;
}
.dash-med-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.dash-med-title {
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
}
.dash-med-total {
  font-size: 12px;
  color: var(--color-text-muted);
}
.med-progress-bar {
  height: 8px;
  background: #273934;
  border-radius: 999px;
  overflow: hidden;
  display: flex;
  margin-bottom: 12px;
}
.med-bar-safe { background: var(--color-accent-green); width: 80%; }
.med-bar-warn { background: var(--color-accent-amber); width: 12%; }
.med-bar-empty { background: #f87171; width: 8%; }

.med-legend-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--color-text-muted);
}
.med-legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
}
.legend-dot { width: 7px; height: 7px; border-radius: 50%; }
.dot-safe { background: var(--color-accent-green); }
.dot-warn { background: var(--color-accent-amber); }
.dot-empty { background: #f87171; }

/* 底部维护与工具抽屉 */
.dash-tools-list {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-widget);
  overflow: hidden;
}
.dash-tool-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--color-border);
  cursor: pointer;
}
.dash-tool-row:last-child {
  border-bottom: none;
}
.dash-tool-lead {
  display: flex;
  align-items: center;
  gap: 12px;
}
.dash-tool-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text);
}
.dash-tool-tag {
  font-size: 11px;
  color: var(--color-text-muted);
}
.dash-tool-arrow {
  color: #5d756d;
  font-size: 16px;
}
</style>
</head>
<body>
  <div class="dash-header">
    <div class="dash-title-group">
      <h1>控制工作台</h1>
      <p>实时监控、硬件守护与数据中枢</p>
    </div>
    <div class="dash-status-pill">
      <span class="pulse-dot"></span>
      <span>保活运行中</span>
    </div>
  </div>

  <!-- 顶部状态横幅 -->
  <div class="dash-banner">
    <div class="dash-banner-left">
      <div class="dash-avatar-box">药</div>
      <div class="dash-banner-info">
        <h3>家庭药盒中心</h3>
        <p>今日已服 3 次 · 规律达成 100%</p>
      </div>
    </div>
    <div class="dash-badge-streak">
      <div>已守护</div>
      <div>42 天</div>
    </div>
  </div>

  <!-- 2x2 Bento Grid 磁贴 -->
  <div class="bento-grid">
    <div class="bento-widget active">
      <div class="widget-top">
        <div class="widget-icon w-green">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>
        <div class="widget-switch on">
          <div class="widget-switch-thumb"></div>
        </div>
      </div>
      <div class="widget-bottom">
        <h4>强力闹钟唤醒</h4>
        <p>全屏响铃 · 震动穿透</p>
      </div>
    </div>

    <div class="bento-widget active">
      <div class="widget-top">
        <div class="widget-icon w-blue">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <div class="widget-switch on">
          <div class="widget-switch-thumb"></div>
        </div>
      </div>
      <div class="widget-bottom">
        <h4>系统免死保活</h4>
        <p>后台白名单已获授权</p>
      </div>
    </div>

    <div class="bento-widget">
      <div class="widget-top">
        <div class="widget-icon w-purple">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
            <circle cx="12" cy="20" r="1"></circle>
          </svg>
        </div>
        <div class="widget-switch">
          <div class="widget-switch-thumb"></div>
        </div>
      </div>
      <div class="widget-bottom">
        <h4>面对面同步</h4>
        <p>局域网广播未激活</p>
      </div>
    </div>

    <div class="bento-widget active">
      <div class="widget-top">
        <div class="widget-icon w-amber">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path>
          </svg>
        </div>
        <div class="widget-switch on">
          <div class="widget-switch-thumb"></div>
        </div>
      </div>
      <div class="widget-bottom">
        <h4>AI 说明书大脑</h4>
        <p>DeepSeek-R1 极速就绪</p>
      </div>
    </div>
  </div>

  <!-- 在库药品健康度 -->
  <div class="dash-med-card">
    <div class="dash-med-head">
      <span class="dash-med-title">在库药品状态概览</span>
      <span class="dash-med-total">共 12 种药品</span>
    </div>
    <div class="med-progress-bar">
      <div class="med-bar-safe" title="充足"></div>
      <div class="med-bar-warn" title="临期"></div>
      <div class="med-bar-empty" title="缺药"></div>
    </div>
    <div class="med-legend-row">
      <div class="med-legend-item">
        <span class="legend-dot dot-safe"></span>
        <span>库存充足 (10)</span>
      </div>
      <div class="med-legend-item">
        <span class="legend-dot dot-warn"></span>
        <span>余量偏低 (1)</span>
      </div>
      <div class="med-legend-item">
        <span class="legend-dot dot-empty"></span>
        <span>需要补药 (1)</span>
      </div>
    </div>
  </div>

  <!-- 工具与维护列表 -->
  <div class="dash-tools-list">
    <div class="dash-tool-row">
      <div class="dash-tool-lead">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span class="dash-tool-title">本地加密快照备份</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="dash-tool-tag">已自动保存</span>
        <span class="dash-tool-arrow">›</span>
      </div>
    </div>

    <div class="dash-tool-row">
      <div class="dash-tool-lead">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span class="dash-tool-title">时段划分与闹钟时刻</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="dash-tool-tag">早中晚 4 段</span>
        <span class="dash-tool-arrow">›</span>
      </div>
    </div>

    <div class="dash-tool-row">
      <div class="dash-tool-lead">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span class="dash-tool-title">关于与软件更新</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="dash-tool-tag">v1.0.7 正式版</span>
        <span class="dash-tool-arrow">›</span>
      </div>
    </div>
  </div>
</body>
</html>
