<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简版本 3 - 紧凑排印清单</title>
<style>
:root {
  --bg: #ffffff;
  --text: #000000;
  --text-muted: #6e6e73;
  --border: #f0f0f2;
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "MiSans", "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.4;
  padding: 20px 20px 80px;
  max-width: 420px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
}

/* 顶部瑞士排印风格大标题 */
.swiss-header {
  padding: 10px 0 24px;
}
.swiss-title {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -1px;
}
.swiss-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
  font-weight: 500;
}

/* 纯排印三列数据（无卡片、无背景，纯留白与数字） */
.swiss-stats {
  display: flex;
  justify-content: space-between;
  padding: 16px 0 24px;
  border-top: 1.5px solid #000000;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
.stat-col {
  display: flex;
  flex-direction: column;
}
.stat-num {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.stat-lbl {
  font-size: 11px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 2px;
  font-weight: 600;
}

/* 紧凑列表 */
.section-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #000000;
  margin: 20px 0 8px;
}
.compact-list {
  display: flex;
  flex-direction: column;
}
.compact-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  background: #ffffff;
}
.compact-row:active {
  opacity: 0.5;
}
.row-lead {
  display: flex;
  align-items: center;
  gap: 12px;
}
.icon-pure {
  width: 18px;
  height: 18px;
  color: #000000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.row-text {
  font-size: 15px;
  font-weight: 500;
}
.row-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}
.tag-text {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
}
.arrow {
  color: #c7c7cc;
  font-size: 14px;
}

/* 极简底部印记 */
.swiss-footer {
  margin-top: 40px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--text-muted);
}
.swiss-version {
  font-weight: 600;
  color: #000000;
}
</style>
</head>
<body>
  <!-- 顶部瑞士大字排印 -->
  <div class="swiss-header">
    <h1 class="swiss-title">我的</h1>
    <div class="swiss-sub">42 天守护 · 128 次服药记录</div>
  </div>

  <!-- 3 列纯排印数字 -->
  <div class="swiss-stats">
    <div class="stat-col">
      <span class="stat-num">12</span>
      <span class="stat-lbl">在库药品</span>
    </div>
    <div class="stat-col">
      <span class="stat-num">4</span>
      <span class="stat-lbl">用药计划</span>
    </div>
    <div class="stat-col">
      <span class="stat-num">100%</span>
      <span class="stat-lbl">服药达成</span>
    </div>
  </div>

  <!-- 提醒与运行 -->
  <div class="section-label">提醒与保活</div>
  <div class="compact-list">
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-pure">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </span>
        <span class="row-text">服药闹钟</span>
      </div>
      <div class="row-meta">
        <span class="tag-text">响铃+振动</span>
        <span class="arrow">›</span>
      </div>
    </div>
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-pure">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </span>
        <span class="row-text">时段划分</span>
      </div>
      <div class="row-meta">
        <span class="tag-text">4 段</span>
        <span class="arrow">›</span>
      </div>
    </div>
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-pure">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        </span>
        <span class="row-text">后台保活</span>
      </div>
      <div class="row-meta">
        <span class="tag-text">已允许</span>
        <span class="arrow">›</span>
      </div>
    </div>
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-pure">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line></svg>
        </span>
        <span class="row-text">外观模式</span>
      </div>
      <div class="row-meta">
        <span class="tag-text">跟随系统</span>
        <span class="arrow">›</span>
      </div>
    </div>
  </div>

  <!-- 数据与智能 -->
  <div class="section-label">数据与智能</div>
  <div class="compact-list">
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-pure">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle></svg>
        </span>
        <span class="row-text">面对面同步</span>
      </div>
      <div class="row-meta">
        <span class="tag-text">就绪</span>
        <span class="arrow">›</span>
      </div>
    </div>
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-pure">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </span>
        <span class="row-text">数据备份</span>
      </div>
      <div class="row-meta">
        <span class="tag-text">自动快照</span>
        <span class="arrow">›</span>
      </div>
    </div>
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-pure">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>
        </span>
        <span class="row-text">AI 助手</span>
      </div>
      <div class="row-meta">
        <span class="tag-text">DeepSeek</span>
        <span class="arrow">›</span>
      </div>
    </div>
    <div class="compact-row">
      <div class="row-lead">
        <span class="icon-pure">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        </span>
        <span class="row-text">版本更新</span>
      </div>
      <div class="row-meta">
        <span class="tag-text">v1.0.7 最新</span>
        <span class="arrow">›</span>
      </div>
    </div>
  </div>

  <!-- 底部纯净印记 -->
  <div class="swiss-footer">
    <span>小药盒 · 本地离线运行</span>
    <span class="swiss-version">v1.0.7</span>
  </div>
</body>
</html>
