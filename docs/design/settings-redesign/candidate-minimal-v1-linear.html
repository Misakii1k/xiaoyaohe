<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简 1 - 小药盒原生清爽线性流</title>
<style>
:root {
  /* 严格遵循小药盒官方 tokens.css */
  --color-bg: #f6f8f7;
  --color-surface: #ffffff;
  --color-surface-muted: #edf1ef;
  --color-text: #202e2b;
  --color-text-muted: #64706b;
  --color-border: #e1e8e4;
  --color-primary: #236a55;
  --color-primary-pressed: #175940;
  --color-primary-soft: #e3ede6;
  --font-sans: 'MiSans', 'HarmonyOS Sans SC', 'PingFang SC', -apple-system, sans-serif;
  --radius-md: 16px;
  --radius-lg: 20px;
  --radius-full: 999px;
  --shadow-sm: 0 1px 3px rgba(32, 46, 43, 0.04), 0 4px 12px rgba(32, 46, 43, 0.03);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.45;
  padding: 16px 16px 84px;
  max-width: 440px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
}
.header {
  padding: 12px 4px 16px;
}
.header h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.6px;
  color: var(--color-text);
}

/* 顶部精炼名片：白底卡片 + 品牌青绿头像 + 极简数据单行 */
.profile-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.profile-main {
  display: flex;
  align-items: center;
  gap: 14px;
}
.avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--color-primary);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.profile-info h2 {
  font-size: 16px;
  font-weight: 700;
  color: var(--color-text);
}
.profile-info p {
  font-size: 13px;
  color: var(--color-text-muted);
  margin-top: 2px;
}
.badge-pill {
  font-size: 11px;
  font-weight: 600;
  color: var(--color-primary);
  background: var(--color-primary-soft);
  padding: 4px 10px;
  border-radius: var(--radius-full);
  white-space: nowrap;
}

/* 分组白底卡片，内嵌细线分割 */
.group-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-muted);
  margin: 18px 4px 8px;
  letter-spacing: 0.3px;
}
.group-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.row-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  position: relative;
  cursor: pointer;
  background: #ffffff;
  transition: background 0.15s;
}
.row-item:active {
  background: #f7faf8;
}
.row-item::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 48px;
  right: 16px;
  height: 1px;
  background: var(--color-border);
}
.row-item:last-child::after {
  display: none;
}
.row-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.icon-mono {
  width: 20px;
  height: 20px;
  color: var(--color-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.row-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--color-text);
}
.row-right {
  display: flex;
  align-items: center;
  gap: 6px;
}
.row-state {
  font-size: 13px;
  color: var(--color-text-muted);
}
.row-state.brand {
  color: var(--color-primary);
  font-weight: 600;
}
.chevron {
  color: #b5c2bc;
  font-size: 15px;
}

.footer-brand {
  text-align: center;
  font-size: 12px;
  color: var(--color-text-muted);
  margin-top: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
</style>
</head>
<body>
  <div class="header">
    <h1>我的</h1>
  </div>

  <!-- 顶部轻名片 -->
  <div class="profile-card">
    <div class="profile-main">
      <div class="avatar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="profile-info">
        <h2>小药盒用户</h2>
        <p>12 种在库 · 128 次服药</p>
      </div>
    </div>
    <span class="badge-pill">第 42 天</span>
  </div>

  <!-- 分组一：提醒与用药 -->
  <div class="group-label">提醒与用药</div>
  <div class="group-card">
    <div class="row-item">
      <div class="row-left">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </span>
        <span class="row-title">服药提醒</span>
      </div>
      <div class="row-right">
        <span class="row-state brand">响铃 + 振动</span>
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="row-item">
      <div class="row-left">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </span>
        <span class="row-title">时段划分</span>
      </div>
      <div class="row-right">
        <span class="row-state">4 个时段</span>
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="row-item">
      <div class="row-left">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        </span>
        <span class="row-title">后台保活</span>
      </div>
      <div class="row-right">
        <span class="row-state brand">已允许</span>
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="row-item">
      <div class="row-left">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line></svg>
        </span>
        <span class="row-title">外观显示</span>
      </div>
      <div class="row-right">
        <span class="row-state">系统默认</span>
        <span class="chevron">›</span>
      </div>
    </div>
  </div>

  <!-- 分组二：数据与互联 -->
  <div class="group-label">数据与互联</div>
  <div class="group-card">
    <div class="row-item">
      <div class="row-left">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle></svg>
        </span>
        <span class="row-title">面对面同步</span>
      </div>
      <div class="row-right">
        <span class="row-state brand">就绪</span>
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="row-item">
      <div class="row-left">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </span>
        <span class="row-title">数据备份</span>
      </div>
      <div class="row-right">
        <span class="row-state">已自动快照</span>
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="row-item">
      <div class="row-left">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        </span>
        <span class="row-title">存储缓存</span>
      </div>
      <div class="row-right">
        <span class="row-state">2.4 MB</span>
        <span class="chevron">›</span>
      </div>
    </div>
  </div>

  <!-- 分组三：智能与通用 -->
  <div class="group-label">智能与关于</div>
  <div class="group-card">
    <div class="row-item">
      <div class="row-left">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>
        </span>
        <span class="row-title">AI 助手</span>
      </div>
      <div class="row-right">
        <span class="row-state">DeepSeek-R1</span>
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="row-item">
      <div class="row-left">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        </span>
        <span class="row-title">版本更新</span>
      </div>
      <div class="row-right">
        <span class="row-state">v1.0.7 最新</span>
        <span class="chevron">›</span>
      </div>
    </div>
    <div class="row-item">
      <div class="row-left">
        <span class="icon-mono">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </span>
        <span class="row-title">关于小药盒</span>
      </div>
      <div class="row-right">
        <span class="chevron">›</span>
      </div>
    </div>
  </div>

  <div class="footer-brand">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2.2">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    </svg>
    <span>纯本地设备私密存储 · 无广告</span>
  </div>
</body>
</html>
