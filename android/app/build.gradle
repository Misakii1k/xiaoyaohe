apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Local release signing (keystore.properties is gitignored; generate with keytool if missing)
def keystorePropertiesFile = rootProject.file('app/keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.medbox.app"
    compileSdk = rootProject.ext.compileSdkVersion
    // 与 capacitor.build.gradle 的 Java 21 保持一致，否则混合编译报 Inconsistent JVM-target
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    kotlinOptions {
        jvmTarget = '21'
        // CameraX 的 Proxy.getImage 带 ExperimentalGetImage 注解，全局 opt-in 省样板
        freeCompilerArgs += ["-opt-in=androidx.camera.core.ExperimentalGetImage"]
    }
    defaultConfig {
        applicationId "com.medbox.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 61
        versionName "1.1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:*.apk'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // ── 液态玻璃全屏提醒页（Kotlin + Compose + Kyant0/AndroidLiquidGlass）──
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    // Compose 栈：backdrop 1.0.6 的 POM 声明 androidx.compose 1.10.3（不走 JetBrains 线），
    // 且其 android 变体不带出传递依赖，须显式声明同一版本避免双运行时类冲突。
    // 文字用 foundation 的 BasicText（material3 无对应稳定版，不引入）。
    implementation "androidx.compose.foundation:foundation:$androidxComposeVersion"
    implementation "androidx.compose.ui:ui:$androidxComposeVersion"
    implementation "androidx.compose.ui:ui-graphics:$androidxComposeVersion"
    implementation "io.github.kyant0:shapes:1.2.0"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    // 扫码解除强制提醒：CameraX 取景 + ZXing QR 解码（纯 Java，无内置识别模型，控体积；
    // MLKit bundled 会让 APK +25MB，不采用）
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation "com.google.zxing:core:3.5.3"
    // backdrop 1.0.6：aar-metadata minCompileSdk=36 与本工程匹配；
    // 2.0.x 线要求 compileSdk 37 + AGP 9.1（Capacitor 8 矩阵不支持），暂不可升。
    implementation "io.github.kyant0:backdrop:1.0.6"
    testImplementation "junit:junit:$junitVersion"
    // JVM 单测里 android.jar 的 org.json 是抛 "not mocked" 的桩，用真实实现顶替
    testImplementation 'org.json:json:20240303'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
