ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    /* Kotlin / Compose / LiquidGlass：与 io.github.kyant0:backdrop（液态玻璃库）对齐。
       backdrop-android 1.0.6 的 aar-metadata 要求 minCompileSdk=36（与本工程一致），
       其依赖线为 Kotlin 2.3.10 + JB Compose Multiplatform 1.10.3。
       注意：2.0.x 线全部要求 minCompileSdk=37 + AGP 9.1，Capacitor 8 官方矩阵
       （AGP 8.13 + compileSdk 36）不支持，升级 backdrop 前须先升 Android 工程矩阵。 */
    kotlinVersion = '2.3.10'
    jbComposeVersion = '1.10.3'
    androidxComposeVersion = '1.10.3'
    /* 扫码解除强制提醒：相机 + 条码识别（bundled 版，无需 Firebase） */
    cameraxVersion = '1.6.2'
    mlkitBarcodeVersion = '17.3.0'
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}