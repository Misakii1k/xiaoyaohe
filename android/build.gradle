// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Kotlin + Compose 编译插件（MedicationAlarmActivity 液态玻璃页使用）。
        // buildscript 先于 variables.gradle 求值，只能写字面量；版本须与
        // variables.gradle 的 kotlinVersion 保持一致（backdrop 1.0.6 依赖线 2.3.10）。
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.10'
        // Compose 编译插件的实现构件（apply plugin 'org.jetbrains.kotlin.plugin.compose' 由它提供）
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.3.10'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    configurations.all {
        resolutionStrategy {
            // kotlin-stdlib 1.8 起已把 jdk7/jdk8 并入主构件；传递依赖带入的旧
            // 1.6.x kotlin-stdlib-jdk7/jdk8 会在 androidTest 类路径上与 1.8.x
            // 主构件产生重复类（checkDebugAndroidTestDuplicateClasses 失败）。
            // 统一抬到 1.8.22：该版本起 jdk7/jdk8 只是空壳委派构件，不再携带类。
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
